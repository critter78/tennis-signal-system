services:
  - type: web
    name: tennis-betting-server
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/status
  - type: cron
    name: daily-signal-generator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    schedule: "0 12 * * *"
    startCommand: python3 run_daily_render.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
