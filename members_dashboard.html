<style>

body { background: #0f1117; color: #e0e0e0; min-height: 100vh; padding-bottom: 50px; }

/* ── Header ── */
.header { border-bottom: 1px solid #2d3139; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; background: linear-gradient(180deg, #f5b942 0%, #d4740a 50%, #c45e08 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 1px 2px rgba(212,116,10,0.3)); }

.header-logo { height: 50px; width: 50px; margin-right: 6px; flex-shrink: 0; }
.session { display: flex; align-items: center; gap: 14px; font-size: 11px; }
.session .email { color: #c4a44e; letter-spacing: 0.04em; }
.session a.logout { color: #6c757d; text-decoration: none; padding: 6px 12px; border: 1px solid #2d3139; font-size: 10px; letter-spacing: 0.04em; transition: all 0.2s; }
.session a.logout:hover { color: #d4740a; border-color: #d4740a; }

/* ── Tabs ── */
.tabs { display: flex; gap: 0; padding: 0 24px; background: #0f1117; border-bottom: 2px solid #2d3139; overflow-x: auto; }
.tab { background: none; border: none; color: #6c757d; padding: 10px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; font-family: inherit; white-space: nowrap; }
.tab:hover { color: #e0e0e0; }
.tab.active { color: #d4740a; border-bottom-color: #d4740a; }

/* ── Layout ── */
main { padding: 24px; max-width: 1400px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }
.muted { color: #6c757d; font-size: 12px; line-height: 1.6; }
.empty { padding: 60px 20px; text-align: center; color: #6c757d; font-size: 13px; }

/* ── Filters ── */
.filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { background: #1a1d27; color: #e0e0e0; border: 1px solid #2d3139; padding: 6px 10px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
.filters select:focus, .filters input:focus { outline: none; border-color: #d4740a; }
.filters label { font-size: 10px; color: #6c757d; }
.filters .search { flex: 1; min-width: 200px; }
.filters button { background: #d4740a; color: white; border: none; padding: 6px 14px; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; transition: all 0.2s; }
.filters button:hover { background: #e65100; }
.filters button.ghost { background: transparent; border: 1px solid #2d3139; color: #6c757d; }
.filters button.ghost:hover { color: #d4740a; border-color: #d4740a; }

/* ── Signal Summary Bar ── */
.sig-summary { background: #1a1d27; border: 1px solid #2d3139; padding: 14px 18px; margin-bottom: 14px; font-size: 13px; color: #aaa; display: flex; gap: 24px; flex-wrap: wrap; border-radius: 8px; }
.sig-summary strong { color: #e0e0e0; }

/* ══════════════════════════════════════════════════════════════════════

.sig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 18px; }

.v5-tab-btn { flex: 1; padding: 8px 4px; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; background: transparent; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; font-family: 'IBM Plex Mono', monospace; border-right: 1px solid #2a2d37; }

@keyframes boltFlash { 0%,100% { filter: brightness(1); } 20% { filter: brightness(2.5) drop-shadow(0 0 4px #ffd600); } 40% { filter: brightness(0.8); } 60% { filter: brightness(2) drop-shadow(0 0 3px #ffd600); } 80% { filter: brightness(1); } }

/* MATCHUP: two rackets apart -> clash with ball */
.ti-matchup { display: flex !important; justify-content: center; align-items: center; gap: 1px; margin-bottom: 4px; }
.ti-matchup .racket-l, .ti-matchup .racket-r { display: inline-block; width: 12px; height: 22px; transition: transform 0.25s ease-out; }
.ti-matchup .racket-l { transform: translateX(-2px) rotate(-8deg); }
.ti-matchup .racket-r { transform: translateX(2px) rotate(8deg); }
.ti-matchup .clash-ball { width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c8e64a, #8bc34a 50%, #689f38); box-shadow: inset -1px -1px 2px rgba(0,0,0,0.3); transform: scale(0); transition: transform 0.1s; flex-shrink: 0; }
@keyframes clashL { 0% { transform: translateX(-2px) rotate(-8deg); } 40% { transform: translateX(3px) rotate(8deg); } 55% { transform: translateX(1px) rotate(4deg); } 70% { transform: translateX(2px) rotate(6deg); } 100% { transform: translateX(1px) rotate(2deg); } }
@keyframes clashR { 0% { transform: translateX(2px) rotate(8deg); } 40% { transform: translateX(-3px) rotate(-8deg); } 55% { transform: translateX(-1px) rotate(-4deg); } 70% { transform: translateX(-2px) rotate(-6deg); } 100% { transform: translateX(-1px) rotate(-2deg); } }
@keyframes ballPop { 0%,30% { transform: scale(0); } 40% { transform: scale(1.4); } 55% { transform: scale(0.9); } 65% { transform: scale(1.15); } 80%,100% { transform: scale(1); } }
.v5-tab-btn:hover .ti-matchup .racket-l { animation: clashL 0.45s ease-out forwards; }
.v5-tab-btn:hover .ti-matchup .racket-r { animation: clashR 0.45s ease-out forwards; }
.v5-tab-btn:hover .ti-matchup .clash-ball { animation: ballPop 0.5s ease-out forwards; }
/* Court icon: hard court default, hover turns to grass GREEN */
.ti-court img { width: 24px; height: 24px; transition: filter 0.3s; }
.v5-tab-btn:hover .ti-court img { filter: hue-rotate(-90deg) saturate(1.8) brightness(1.1); }
/* Market icon: shake on hover */
.ti-market img { width: 24px; height: 24px; }
@keyframes moneyShake { 0%,100% { transform: translateX(0) rotate(0); } 15% { transform: translateX(-2px) rotate(-4deg); } 30% { transform: translateX(2px) rotate(4deg); } 45% { transform: translateX(-2px) rotate(-3deg); } 60% { transform: translateX(1px) rotate(2deg); } 75% { transform: translateX(-1px) rotate(-1deg); } }
.v5-tab-btn:hover .ti-market img { animation: moneyShake 0.5s ease-in-out; }

@keyframes freshDotCycle {

/* ── Player Cards (v5 style) ── */
.pc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; }

.pc-fs-lbl { font-size: 8px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }

/* ── Modal ── */
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 50; align-items: center; justify-content: center; padding: 20px; }

.modal .box h3 { font-size: 13px; color: #d4740a; letter-spacing: 0.06em; margin-bottom: 12px; }

.modal .box button.primary:hover { background: #e8943a; }

/* ── Footer ── */
footer { position: fixed; bottom: 0; left: 0; right: 0; background: #13151d; border-top: 1px solid #2d3139; padding: 8px 20px; display: flex; align-items: center; justify-content: center; gap: 0; z-index: 100; }
footer .brand-critter { font-size: 10px; font-weight: 700; letter-spacing: 0.10em; background: linear-gradient(180deg, #e2b968 0%, #d4a04a 30%, #c4873a 60%, #b87333 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }

/* ── Responsive ── */

<script>
// ─── Tab switching ────────────────────────────────────────────────────────
function showTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    history.replaceState(null, '', '#' + name);
    if (name === 'signals' && !state.signalsLoaded) loadSignals();
    if (name === 'bets' && !state.betsLoaded) loadBets();
    if (name === 'players' && !state.playersLoaded) loadPlayers();
    if (name === 'performance') loadStats();
}

// ─── v5.1 TAB SWITCHING (per-card signal/matchup/deep/market) ────────────
function v5switchTab(btn, tabName) {
    var card = btn.closest('.sig-card');
    card.querySelectorAll('.v5-tab-btn').forEach(function(b){ b.classList.remove('active'); });
    card.querySelectorAll('.v5-tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    card.querySelector('[data-v5tab="'+tabName+'"]').classList.add('active');
}

// ─── State ────────────────────────────────────────────────────────────────
const state = {
    signals: [], resolved: [], signalsLoaded: false,
    bets: [], betsLoaded: false,
    players: [], playersLoaded: false,
    trackingSignal: null,
};

function fmt(num, digits) {
    if (num === null || num === undefined || num === '') return '—';
    return Number(num).toFixed(digits === undefined ? 1 : digits);
}
function pctStr(num) { return num === null || num === undefined ? '—' : Number(num).toFixed(1) + '%'; }
function priceStr(num) { return num === null || num === undefined ? '—' : Number(num).toFixed(1) + '¢'; }
function escapeHtml(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function surfaceColor(s) {
    if (!s) return '#6c757d';
    if (s === 'Hard') return '#4fc3f7';
    if (s === 'Clay') return '#ff8a65';
    if (s === 'Grass') return '#81c784';
    return '#6c757d';
}

// ─── SVG constants (copied from main dashboard) ──────────────────────────
const tennisBallSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke-linejoin='round' stroke-linecap='round'%3E%3Cdefs%3E%3CradialGradient id='tb-body' cx='40%25' cy='35%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23eaff5c'/%3E%3Cstop offset='70%25' stop-color='%23c4dd1f'/%3E%3Cstop offset='100%25' stop-color='%2389a00c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='24' cy='24' r='17' fill='url(%23tb-body)' stroke='%236b7f10' stroke-width='1'/%3E%3Cpath d='M8.5 19 Q 24 33, 39.5 19' stroke='%23ffffff' stroke-width='1.8' fill='none'/%3E%3Cpath d='M8.5 29 Q 24 15, 39.5 29' stroke='%23ffffff' stroke-width='1.8' fill='none'/%3E%3C/svg%3E";

function winMark(condition, side) {
    return condition ? '<img class="v5-win-mark' + (side === 'r' ? ' v5-win-mark-r' : '') + '" src="' + tennisBallSvg + '" title="Advantage">' : '';
}

// ─── SIGNALS ──────────────────────────────────────────────────────────────
async function loadSignals() {
    document.getElementById('signalsGrid').innerHTML = '<div class="empty">Loading signals...</div>';
    try {
        // Fetch signals + resolved stats in parallel
        const [sigRes, statsRes] = await Promise.all([
            fetch('/members/api/signals'),
            fetch('/members/api/stats')
        ]);
        if (sigRes.status === 401) { location.href = '/members'; return; }
        const sigData = await sigRes.json();
        state.signals = sigData.signals || [];

        // Get resolved picks for SYS WR buckets
        try {
            const statsData = await statsRes.json();
            state.resolved = statsData.resolved || [];
        } catch(e) { state.resolved = []; }

        state.signalsLoaded = true;
        renderSignals();
    } catch (e) {
        document.getElementById('signalsGrid').innerHTML = '<div class="empty">Error loading signals: ' + e.message + '</div>';
    }
}

function renderSignals() {
    const grid = document.getElementById('signalsGrid');
    const filterType = document.getElementById('sigFilterType').value;
    const filterSurface = document.getElementById('sigFilterSurface').value;
    const sortBy = document.getElementById('sigSort').value;

    // Show today's picks, deduplicated by market_id
    const today = new Date().toISOString().slice(0, 10);
    const todayPicks = state.signals.filter(p => (p.logged_at || '').startsWith(today));
    const seen = new Map();
    todayPicks.forEach(p => {
        const key = p.market_id || (p.player_a + ' vs ' + p.player_b + '|' + p.market_type);
        seen.set(key, p);
    });
    let latest = Array.from(seen.values());
    // If no picks today, fall back to latest run
    if (latest.length === 0) {
        const latestRun = state.signals.length > 0 ? state.signals[state.signals.length - 1].run_id : null;
        latest = latestRun ? state.signals.filter(p => p.run_id === latestRun) : state.signals;
    }
    // Hide resolved/completed matches
    latest = latest.filter(p => p.outcome === null || p.outcome === undefined);

    // Apply filters
    if (filterType === 'edge') latest = latest.filter(p => p.has_edge);
    else if (filterType === 'outright') latest = latest.filter(p => p.market_type === 'outright');
    else if (filterType === 'h2h') latest = latest.filter(p => p.market_type === 'h2h');
    if (filterSurface !== 'all') latest = latest.filter(p => p.surface === filterSurface);

    // Sort
    if (sortBy === 'edge') latest.sort((a, b) => Math.abs(b.edge || 0) - Math.abs(a.edge || 0));
    else if (sortBy === 'confidence') latest.sort((a, b) => (b.confidence || 0) - (a.confidence || 0));
    else if (sortBy === 'winprob') latest.sort((a, b) => (b.model_prob || 0) - (a.model_prob || 0));
    else if (sortBy === 'volume') latest.sort((a, b) => (b.volume || 0) - (a.volume || 0));

    if (latest.length === 0) {
        grid.innerHTML = '<div class="empty">No signals match your filters.</div>';
        return;
    }

    const resolved = state.resolved || [];

    // Summary bar
    const edgeCount = latest.filter(p => p.has_edge).length;
    const avgEdge = edgeCount > 0 ? (latest.filter(p => p.has_edge).reduce((s, p) => s + Math.abs(p.edge), 0) / edgeCount).toFixed(1) : '0';
    const totalVol = latest.reduce((s, p) => s + (p.volume || 0), 0);
    let html = '<div class="sig-summary">' +
        '<span>Showing: <strong>' + latest.length + '</strong> signals</span>' +
        '<span>Edge Signals: <strong>' + edgeCount + '</strong></span>' +
        '<span>Avg Edge: <strong>' + avgEdge + '%</strong></span>' +
        '<span>Total Volume: <strong>$' + totalVol.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0}) + '</strong></span>' +
    '</div>';

    html += '<div class="sig-grid">';

    // ─── SYS WIN RATE calibration buckets ───
    const sysWrBuckets = [
        { min: 70, max: 200, label: '70%+',  w: 0, n: 0 },
        { min: 65, max: 70,  label: '65-70', w: 0, n: 0 },
        { min: 60, max: 65,  label: '60-65', w: 0, n: 0 },
        { min: 55, max: 60,  label: '55-60', w: 0, n: 0 },
        { min: 50, max: 55,  label: '50-55', w: 0, n: 0 },
        { min: 0,  max: 50,  label: '<50',   w: 0, n: 0 },
    ];
    resolved.forEach(r => {
        const mp = r.model_prob || 0;
        const bucket = sysWrBuckets.find(b => mp >= b.min && mp < b.max);
        if (bucket) { bucket.n++; if (r.outcome === 'win') bucket.w++; }
    });
    const globalSysWR = resolved.length > 10

// ─── TRACK FROM SIGNAL MODAL ──────────────────────────────────────────────
function openTrack(signal) {
    state.trackingSignal = signal;
    document.getElementById('trackCtx').innerHTML =
        '<strong>' + escapeHtml(signal.match) + '</strong><br>Pick: ' + escapeHtml(signal.bet_on) + ' • Model ' + pctStr(signal.model_prob) + ' • Market ' + priceStr(signal.poly_price);
    document.getElementById('tm-price').value = signal.poly_price ? Number(signal.poly_price).toFixed(1) : '';
    document.getElementById('tm-stake').value = 50;
    document.getElementById('tm-notes').value = '';
    document.getElementById('trackModal').classList.add('open');
}
function closeTrack() {
    document.getElementById('trackModal').classList.remove('open');
    state.trackingSignal = null;
}
async function confirmTrack() {
    var s = state.trackingSignal;
    if (!s) return;
    var payload = {
        match: s.match,
        bet_on: s.bet_on,
        stake: parseFloat(document.getElementById('tm-stake').value),
        price: parseFloat(document.getElementById('tm-price').value),
        tournament: s.tournament,
        surface: s.surface,
        model_prob: s.model_prob,
        notes: document.getElementById('tm-notes').value,
    };
    var r = await fetch('/members/api/bets', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
    });
    var data = await r.json();
    if (r.ok) {
        closeTrack();
        state.betsLoaded = false;
        showTab('bets');
    } else {
        alert('Error: ' + (data.error || 'unknown'));
    }
}

// ─── BETS ─────────────────────────────────────────────────────────────────
async function loadBets() {
    document.getElementById('betsBody').innerHTML = '<div class="empty">Loading...</div>';
    try {
        var r = await fetch('/members/api/bets');
        if (r.status === 401) { location.href = '/members'; return; }
        var data = await r.json();
        state.bets = data.bets || [];
        state.betsLoaded = true;
        renderBets();
        loadStats();
    } catch (e) {
        document.getElementById('betsBody').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
    }
}

function renderBets() {
    var wrap = document.getElementById('betsBody');
    var filter = document.getElementById('betFilter').value;
    var list = state.bets;
    if (filter === 'open') list = list.filter(function(b){ return !b.outcome; });
    if (filter === 'closed') list = list.filter(function(b){ return b.outcome; });
    if (!list.length) {
        wrap.innerHTML = '<div class="empty">No bets to show. Log one above or track a signal from the Signals tab.</div>';
        return;
    }
    wrap.innerHTML = '<div class="table-wrap"><table><thead><tr>' +
        '<th>Match</th><th>Pick</th><th>Stake</th><th>Price</th><th>Status</th><th>P&amp;L</th><th>Logged</th><th></th></tr></thead><tbody>' +
        list.map(function(b) {
            var outcome = b.outcome
                ? '<span class="badge ' + b.outcome + '">' + b.outcome.toUpperCase() + '</span>'
                : '<span class="badge open">OPEN</span>';
            var pnl = b.outcome
                ? '<span class="' + ((b.pnl || 0) >= 0 ? 'pos' : 'neg') + '">' + ((b.pnl || 0) >= 0 ? '+' : '') + fmt(b.pnl, 2) + '</span>'
                : '—';
            var date = b.created_at ? new Date(b.created_at + 'Z').toLocaleDateString() : '—';
            return '<tr>' +
                '<td>' + escapeHtml(b.match) + '</td>' +
                '<td><strong>' + escapeHtml(b.bet_on) + '</strong>' + (b.surface ? ' <span class="surface-' + escapeHtml(b.surface) + '" style="font-size:9px">' + escapeHtml(b.surface) + '</span>' : '') + '</td>' +
                '<td>$' + fmt(b.stake, 2) + '</td>' +
                '<td>' + priceStr(b.price) + '</td>' +
                '<td>' + outcome + '</td>' +
                '<td>' + pnl + '</td>' +
                '<td style="font-size:10px;color:#6c757d">' + date + '</td>' +
                '<td><button class="danger" onclick="deleteBet(\'' + b.id + '\')">DELETE</button></td>' +
            '</tr>';
        }).join('') + '</tbody></table></div>';
}

async function submitBet(ev) {
    ev.preventDefault();
    var payload = {
        match: document.getElementById('bf-match').value.trim(),
        bet_on: document.getElementById('bf-bet_on').value.trim(),
        stake: parseFloat(document.getElementById('bf-stake').value),
        price: parseFloat(document.getElementById('bf-price').value),
        tournament: document.getElementById('bf-tournament').value.trim(),
        surface: document.getElementById('bf-surface').value.trim(),
        notes: document.getElementById('bf-notes').value.trim(),
    };
    var r = await fetch('/members/api/bets', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
    });
    var data = await r.json();
    var msg = document.getElementById('bf-msg');
    if (r.ok) {
        msg.style.color = '#4caf50';
        msg.textContent = 'Bet logged.';
        resetBetForm();
        loadBets();
    } else {
        msg.style.color = '#f44336';
        msg.textContent = 'Error: ' + (data.error || 'unknown');
    }
    setTimeout(function(){ msg.textContent = ''; }, 4000);
}

function resetBetForm() {
    ['bf-match','bf-bet_on','bf-stake','bf-price','bf-tournament','bf-surface','bf-notes'].forEach(function(id){ document.getElementById(id).value = ''; });
}

async function deleteBet(id) {
    if (!confirm('Delete this bet from your log?')) return;
    var r = await fetch('/members/api/bets/' + id, {method: 'DELETE'});
    if (r.ok) loadBets();
    else alert('Delete failed.');
}

// ─── STATS ────────────────────────────────────────────────────────────────
async function loadStats() {
    try {
        var r = await fetch('/members/api/stats');
        if (r.status === 401) { location.href = '/members'; return; }
        var data = await r.json();
        var s = data.stats || {};
        document.getElementById('kpi-total').textContent = s.total != null ? s.total : '—';

        var wrEl = document.getElementById('kpi-wr');
        wrEl.textContent = s.closed ? s.win_rate + '%' : '—';
        wrEl.className = 'value ' + (s.win_rate >= 55 ? 'green' : s.win_rate >= 45 ? 'amber' : 'red');

        var roiEl = document.getElementById('kpi-roi');
        roiEl.textContent = s.wagered > 0 ? (s.roi >= 0 ? '+' : '') + s.roi + '%' : '—';
        roiEl.className = 'value ' + (s.roi > 0 ? 'green' : s.roi < 0 ? 'red' : 'white');

        var pnl = s.pnl || 0;
        var pnlEl = document.getElementById('kpi-pnl');
        pnlEl.textContent = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
        pnlEl.className = 'value ' + (pnl >= 0 ? 'green' : 'red');

        var detail = (s.wins || 0) + ' wins / ' + (s.losses || 0) + ' losses / ' + (s.voids || 0) + ' voids • ' + (s.open || 0) + ' open • $' + (s.wagered || 0).toFixed(2) + ' wagered';
        document.getElementById('kpi-detail').textContent = detail;
    } catch (e) {}
}

        var formHtml = (p.form || []).slice(0, 10).map(function(r){ return '<span class="pc-form-dot ' + (r === 'W' ? 'pc-fw' : 'pc-fl') + '">' + r + '</span>'; }).join('');
        var surfElos = ['Hard','Clay','Grass'].map(function(s) {
            var se = (p.surf_elo || {})[s] || {};

        }).join('');
        var surfBarsHtml = ['Hard','Clay','Grass'].map(function(s) {
            var sd = (p.surfaces || {})[s] || {};
            var se = (p.surf_elo || {})[s] || {};
            var wr = sd.wr || 0;
            var barColor = s === 'Hard' ? '#4fc3f7' : s === 'Clay' ? '#ff8a65' : '#81c784';
            return '<div class="pc-surf-row"><div class="pc-surf-lbl" style="color:' + surfaceColor(s) + '">' + s + '</div><div class="pc-surf-bar"><div class="pc-surf-fill" style="width:' + Math.min(100, wr) + '%; background:' + barColor + '"></div></div><div class="pc-surf-val">' + wr.toFixed(0) + '%</div><div class="pc-surf-elo">' + (se.elo || '—') + '</div></div>';
        }).join('');
        var mental = p.mental || {};
        var mentalHtml = ['deciding','tiebreak','comeback','finals'].map(function(k) {
            var m = mental[k] || {};
            var pct = m.pct != null ? m.pct : '—';
            var color = pct >= 60 ? '#4caf50' : pct >= 45 ? '#ffd740' : '#f44336';
            return '<div class="pc-mental-item"><div class="pc-mental-val" style="color:' + (typeof pct === 'number' ? color : '#e0e0e0') + '">' + pct + (typeof pct === 'number' ? '%' : '') + '</div><div class="pc-mental-lbl">' + k.toUpperCase() + '</div></div>';
        }).join('');

        return '<div class="pc">' +
            '<div class="pc-hdr"><div><div class="pc-name">' + escapeHtml(p.name || '—') + '</div><div class="pc-meta"><span>' + escapeHtml(p.country || '') + '</span><span>' + (p.age ? Math.floor(p.age) + 'y' : '—') + '</span><span>' + handStr + '-handed</span><span>' + escapeHtml(p.tour || '') + '</span></div></div><div class="pc-rk"><div class="pc-rk-num">#' + (p.rank || '—') + '</div><div class="pc-rk-lbl">RANK</div></div></div>' +
            '<div class="pc-elo-row"><div class="pc-elo-cell"><div class="pc-elo-lbl">OVERALL</div><div class="pc-elo-val">' + (p.elo || '—') + '</div>' + (p.elo_pct ? '<div class="pc-elo-pct">' + p.elo_pct + 'th pct</div>' : '') + '</div>' + surfElos + '</div>' +
            '<div class="pc-sec"><div class="pc-sec-title">RECENT FORM</div><div class="pc-form-strip">' + (formHtml || '—') + '</div></div>' +
            '<div class="pc-sec"><div class="pc-sec-title">SURFACE WIN RATE</div>' + surfBarsHtml + '</div>' +
            '<div class="pc-sec"><div class="pc-sec-title">MENTAL GAME</div><div class="pc-mental-grid">' + mentalHtml + '</div></div>' +
        '</div>';
    }).join('') + '</div>';
}

// ─── Phase 3: notification preferences ────────────────────────────────────
async function toggleAlerts(enabled) {
    try {
        await fetch('/members/api/preferences', {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({notify_email: enabled}),
        });
    } catch (e) {}
}

// ─── Boot ─────────────────────────────────────────────────────────────────
(async function init() {
    try {
        var r = await fetch('/members/api/me');
        if (r.status === 401) { location.href = '/members'; return; }
        var me = await r.json();
        var t = document.getElementById('alertsToggle');
        if (t) t.checked = me.notify_email !== false;
    } catch (e) {}
    var h = (location.hash || '').replace('#', '');
    if (h && document.getElementById('panel-' + h)) {
        showTab(h);
    } else {
        loadSignals();
    }
})();
</script>
